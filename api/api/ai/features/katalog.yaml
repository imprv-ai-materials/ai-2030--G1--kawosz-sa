  branza:
    opis: Branża, w której działa biuro. Według dzisiejszego stanu CRM.
    sql: sql/firmografia.sql
    zrodlo:
      system: CRM
      tabele: [crm_biura]
    okno: stan z dnia eksportu CRM, ten sam dla każdego t0
    opoznienie: nie dotyczy, bo CRM daje tylko bieżący stan, bez historii
    wlasciciel: Zespół danych
    wersja: 1.0.0
  miasto:
    opis: Miasto, w którym jest biuro. Według dzisiejszego stanu CRM.
