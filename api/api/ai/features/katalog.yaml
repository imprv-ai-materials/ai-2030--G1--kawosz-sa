    zrodlo:
      system: CRM
      tabele: [crm_biura]
    okno: stan z dnia eksportu CRM, ten sam dla każdego t0
    opoznienie: nie dotyczy, bo CRM daje tylko bieżący stan, bez historii
    wlasciciel: Zespół danych
    wersja: 1.0.0

# Cechy z tabeli agencji, których tu nie ma, i powód (docs/przecieki.md, sekcje 6–7, decyzja 2026-10-12).
pominiete_cechy_agencji:
  dni_do_konca_umowy: Data końca umowy zmienia się w CRM dopiero przy wypowiedzeniu, więc zastępuje ją dni_do_rocznicy.
  status_crm: Status z dnia eksportu, a w t0 każde biuro z populacji ma umowę aktywną.
  zgloszenia_odbior_ekspresu: Odbiór ekspresu biuro zgłasza po wypowiedzeniu, więc przed t0 cecha byłaby zawsze 0.
  rabat_retencyjny_max: Rabat retencyjny AM daje dopiero po wypowiedzeniu, więc przed t0 cecha byłaby zawsze 0.
  miasto_te: Kodowanie miasta średnią etykiety liczy model tylko na zbiorze uczącym (kodowanie_celu.py), a nie SQL.
