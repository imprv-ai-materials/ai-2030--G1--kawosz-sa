context_parser: pypyr.parser.keyvaluepairs
steps:
  - pypyr.steps.debug
  - pypyr.steps.configvars

  # W devcontainerze compose ustawia INNGEST_DEV=http://inngest:8288 — zostawiamy je; na hoście bierzemy
  # port serwera Inngest z pyproject.toml (inngest_dev_url).
  - name: pypyr.steps.envget
    in:
      envGet:
        - env: INNGEST_DEV
          key: inngest_dev
          default: '{inngest_dev_url}'

  - name: pypyr.steps.env
    description: Setting role + Inngest dev env
    in:
      env:
        set:
          # REST-only process — it SENDS Inngest events but does NOT execute
          # background jobs. Those run on `pypyr start_worker`. Run BOTH locally.
          SMART_WROCLAW_ROLE: 'api'
          # Dev mode pointed at the dev server's host port (compose.yaml). With
          # this set no Inngest signing key is needed locally.
          INNGEST_DEV: '{inngest_dev}'
          # Kawosz: baza, dostawy i raporty kwarantanny (zmienne kawosz_* w pyproject.toml).
          KAWOSZ_BAZA: '{kawosz_baza}'
          KAWOSZ_DOSTAWY: '{kawosz_dostawy}'
          KAWOSZ_RAPORTY: '{kawosz_raporty}'

  - name: pypyr.steps.cmd
    description: Starting API (REST) on :8101
    in:
      # `--app-dir api` puts api/ on sys.path so `api.main` resolves to the real
      # package (api/api); without it the local api/ folder shadows it and uvicorn
      # fails with "Could not import module api.main". `--reload-dir api/api` scopes
      # the watcher to source so it doesn't churn on ui/node_modules.
      cmd: poetry run uvicorn api.main:app --app-dir api --reload --reload-dir api/api --host 0.0.0.0 --port 8101
