context_parser: pypyr.parser.keyvaluepairs
steps:
  - pypyr.steps.debug
  - pypyr.steps.configvars

  # W devcontainerze compose ustawia INNGEST_DEV=http://inngest:8288 i to zostaje (nadpisanie go adresem hosta
  # psuje rejestrację funkcji). Na hoście zmiennej nie ma: bierzemy serwer Inngest z `pypyr start_inngest`
  # (inngest_dev_url w pyproject.toml). Bez INNGEST_DEV SDK Inngest startuje w trybie produkcyjnym i żąda
  # klucza podpisu (SigningKeyMissingError).
  - name: pypyr.steps.envget
    in:
      envGet:
        - env: INNGEST_DEV
          key: inngest_dev
          default: '{inngest_dev_url}'

  - name: pypyr.steps.env
    description: Setting role=all (single-process dev)
    in:
      env:
        set:
          # One process serves REST *and* the Inngest function host on :8101 (role=all).
          SMART_WROCLAW_ROLE: 'all'
          INNGEST_DEV: '{inngest_dev}'
          # Kawosz: baza, dostawy i raporty kwarantanny (zmienne kawosz_* w pyproject.toml).
          KAWOSZ_BAZA: '{kawosz_baza}'
          KAWOSZ_DOSTAWY: '{kawosz_dostawy}'
          KAWOSZ_RAPORTY: '{kawosz_raporty}'

  - name: pypyr.steps.cmd
    description: Starting API + Inngest worker (role=all) on :8101
    in:
      # `--app-dir api` fixes `api.main` import shadowing; `--reload-dir api/api`
      # keeps the reloader off ui/node_modules.
      cmd: poetry run uvicorn api.main:app --app-dir api --reload --reload-dir api/api --host 0.0.0.0 --port 8101
