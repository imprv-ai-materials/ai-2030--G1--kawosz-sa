# Local hooks — run the same tools the dev/ pypyr pipelines use, via poetry.
# `pypyr precommit` runs these against all files.
#
# Przy każdym commicie działa tylko cechy-z-przeszlosci. black, isort i flake8 mają stage manual, bo nie ma ich
# w zależnościach (pyproject.toml) i blokowałyby każdy commit. Po dodaniu ich do grupy dev wystarczy usunąć
# `stages: [manual]`; do tego czasu: poetry run pre-commit run --hook-stage manual --all-files.
repos:
  - repo: local
    hooks:
      - id: cechy-z-przeszlosci
        name: cechy_treningowe zgodne z przeliczeniem z danych sprzed t0 (5 losowych par)
        entry: poetry run pytest -q api/tests/ai/features/test_cechy_z_przeszlosci.py
        language: system
        pass_filenames: false
        always_run: true
      - id: black
        name: black
        entry: poetry run black -l 120 -t py312
        language: system
        types: [python]
        stages: [manual]
      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        types: [python]
        stages: [manual]
      - id: flake8
        name: flake8
        entry: poetry run flake8 --max-line-length=120 --extend-ignore=D100,D101,D102,D103,D104,D105,D106,D107,E203,E231,W503,N806,E704
        language: system
        types: [python]
        exclude: adapters/db/migrations/
        stages: [manual]
